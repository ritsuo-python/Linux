<!DOCTYPE html>
<html lang="ja" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>速度計測ヒートマップ 2026年10月</title>
<style>
:root{
  --bg:#0f1117;--bg-s:#1a1d27;--bg-c:#23263a;
  --text:#e8eaf6;--text-sub:#9ca3bf;--text-mute:#5c6280;
  --border:#2e3155;--border-lt:#3d4168;--r:10px;
  --mon:#3d78d0;--tue:#22b894;--wed:#7060c8;
  --thu:#dc7a10;--fri:#cc2a18;--sat:#b050a0;--sun:#7898b4;
  --h0:transparent;
  --h1:#2a1f00;--h1t:#fde68a;
  --h2:#422f00;--h2t:#fbbf24;
  --h3:#6b3d00;--h3t:#fb923c;
  --h4:#7c2d00;--h4t:#f97316;
  --h5:#7f1d1d;--h5t:#fca5a5;
  --h6:#4c0519;--h6t:#fecdd3;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f5f6fa;--bg-s:#fff;--bg-c:#eef0f8;
  --text:#1e2035;--text-sub:#4b5071;--text-mute:#8892b0;
  --border:#c8cde8;--border-lt:#dde0f0;
  --h0:#f0f0f0;
  --h1:#FFF0D6;--h1t:#92400e;--h2:#FECB7A;--h2t:#78350f;
  --h3:#FBA337;--h3t:#451a03;--h4:#E87012;--h4t:#fff;
  --h5:#C44400;--h5t:#fff;--h6:#8C1A00;--h6t:#fff;
}}
:root[data-theme="light"]{
  --bg:#f5f6fa;--bg-s:#fff;--bg-c:#eef0f8;
  --text:#1e2035;--text-sub:#4b5071;--text-mute:#8892b0;
  --border:#c8cde8;--border-lt:#dde0f0;
  --h0:#f0f0f0;
  --h1:#FFF0D6;--h1t:#92400e;--h2:#FECB7A;--h2t:#78350f;
  --h3:#FBA337;--h3t:#451a03;--h4:#E87012;--h4t:#fff;
  --h5:#C44400;--h5t:#fff;--h6:#8C1A00;--h6t:#fff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Arial,sans-serif;font-size:14px;padding:20px 16px 40px;max-width:1280px;margin:0 auto}
h1{font-size:20px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--text-sub);font-size:13px;margin-bottom:20px}
.theme-btn{position:fixed;top:14px;right:16px;background:var(--bg-s);border:1px solid var(--border);color:var(--text-sub);padding:5px 12px;border-radius:20px;cursor:pointer;font-size:12px;z-index:99}
h2{font-size:15px;font-weight:700;margin:24px 0 12px;padding-left:10px;border-left:3px solid var(--mon);color:var(--text)}
.card-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--bg-s);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;flex:1;min-width:130px}
.card .lbl{font-size:11px;color:var(--text-mute);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.card .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card .sub{font-size:11px;color:var(--text-sub);margin-top:3px}
.heatmap-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--border);margin-bottom:20px}
table.hm{border-collapse:collapse;font-size:11px;width:100%;min-width:900px}
table.hm th,table.hm td{padding:3px 5px;text-align:center;border:1px solid var(--border-lt);white-space:nowrap}
table.hm thead th{background:var(--bg-c);font-weight:700;font-size:11px;position:sticky;top:0;z-index:2}
table.hm thead th.hour-h{background:var(--bg-c);position:sticky;left:0;z-index:3}
table.hm td.hour-lbl{background:var(--bg-c);font-weight:600;color:var(--text-sub);position:sticky;left:0;z-index:1;min-width:36px}
table.hm td.row-sum{background:var(--bg-c);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-sub)}
table.hm tfoot td{background:var(--bg-c);font-weight:700;font-variant-numeric:tabular-nums;font-size:11px;position:sticky;bottom:0}
.dow-月{color:var(--mon)}.dow-火{color:var(--tue)}.dow-水{color:var(--wed)}
.dow-木{color:var(--thu)}.dow-金{color:var(--fri)}.dow-土{color:var(--sat)}.dow-日{color:var(--sun)}
.legend{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--text-sub);margin-bottom:14px}
.leg-swatch{width:20px;height:14px;border-radius:3px;display:inline-block;vertical-align:middle;margin-right:3px}
.notice{background:color-mix(in srgb,var(--thu) 12%,var(--bg-s));border:1px solid color-mix(in srgb,var(--thu) 40%,transparent);border-radius:var(--r);padding:10px 14px;font-size:12px;color:var(--text-sub);margin-bottom:16px;line-height:1.7}
.notice strong{color:var(--thu)}
</style>
</head>
<body>
<button class="theme-btn" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'">テーマ切替</button>

<h1>速度計測ヒートマップ ― 2026年10月</h1>
<p class="subtitle">10/1〜10/24 実測集計 ／ 時間帯別台数（行:時間帯 列:日付）</p>

<div id="kpi-row" class="card-row"></div>

<div class="notice">
  <strong>計測状況メモ：</strong>
  10/6(火)・10/8(木)・10/13(火)・10/21(水)・10/22(木) は部分計測。
  10/10(土)・10/11(日)・10/16(金)・10/17(土)・10/24(土) は深夜・早朝帯のみ（日中計測なし）。
  10/3(土)・10/9(金)・10/12(月)・10/14(水)・10/15(木)・10/18(日) は計測なし。
</div>

<h2>時間帯別 台数ヒートマップ</h2>
<div class="legend">
  <span><span class="leg-swatch" style="background:var(--h0);border:1px solid var(--border)"></span>0台</span>
  <span><span class="leg-swatch" style="background:var(--h1)"></span>1〜2台</span>
  <span><span class="leg-swatch" style="background:var(--h2)"></span>3〜4台</span>
  <span><span class="leg-swatch" style="background:var(--h3)"></span>5〜7台</span>
  <span><span class="leg-swatch" style="background:var(--h4)"></span>8〜10台</span>
  <span><span class="leg-swatch" style="background:var(--h5)"></span>11〜14台</span>
  <span><span class="leg-swatch" style="background:var(--h6)"></span>15台以上</span>
</div>

<div class="heatmap-wrap">
  <table class="hm" id="hm-table"></table>
</div>

<script>
const DOW_COLOR={'月':'var(--mon)','火':'var(--tue)','水':'var(--wed)','木':'var(--thu)','金':'var(--fri)','土':'var(--sat)','日':'var(--sun)'};

const DATA={
  1: {dow:'木',hours:{0:1,1:5,2:3,9:7,10:10,11:7,12:6,18:1,19:2},total:42},
  2: {dow:'金',hours:{1:6,2:3,5:1,6:3,8:3,9:8,10:8,11:5,12:9,13:4,14:4,15:1,16:6,17:5,18:1,19:2,20:1,21:1},total:71},
  3: {dow:'土',hours:{},total:0},
  4: {dow:'日',hours:{12:3,13:2,14:2,15:1,16:4,17:1,18:1,19:2,20:3},total:19},
  5: {dow:'月',hours:{6:1,7:2,8:5,9:9,10:6,11:11,12:8,13:3,14:4,15:3,16:4,17:7,18:1,19:2},total:66},
  6: {dow:'火',hours:{8:4,9:11,10:15,11:6},total:36},
  7: {dow:'水',hours:{1:3,2:4,6:1,9:11,10:9,11:9,12:6,13:1},total:44},
  8: {dow:'木',hours:{8:1,9:8,10:9},total:18},
  9: {dow:'金',hours:{},total:0},
 10: {dow:'土',hours:{2:2,3:3,6:1},total:6},
 11: {dow:'日',hours:{2:3,5:1},total:4},
 12: {dow:'月',hours:{},total:0},
 13: {dow:'火',hours:{9:7,10:6,11:7,12:6},total:26},
 14: {dow:'水',hours:{},total:0},
 15: {dow:'木',hours:{},total:0},
 16: {dow:'金',hours:{1:6,2:3,5:3},total:12},
 17: {dow:'土',hours:{1:6,2:3},total:9},
 18: {dow:'日',hours:{},total:0},
 19: {dow:'月',hours:{8:3,9:11,10:9,11:7,12:8,13:4,14:4,15:2,16:4,17:3,19:2,20:3},total:60},
 20: {dow:'火',hours:{2:2,8:1,9:12,10:7,11:8,12:5,13:3,14:3,15:1,16:6,17:3,18:1,19:1},total:53},
 21: {dow:'水',hours:{13:3,14:5,15:3,16:2},total:13},
 22: {dow:'木',hours:{9:3,10:10,11:8,12:7},total:28},
 23: {dow:'金',hours:{3:3,5:1,6:1,8:8,9:9,10:7,11:7,12:7,13:4,14:4,15:4,16:5,17:5,18:4,19:3,20:2,21:1},total:75},
 24: {dow:'土',hours:{4:2,5:2},total:4},
};

const DAYS=Object.keys(DATA).map(Number).sort((a,b)=>a-b);
const HOURS=Array.from({length:24},(_,i)=>i);

function colorCell(n){
  if(n===0)return{bg:'var(--h0)',fg:'var(--text-mute)'};
  if(n<=2) return{bg:'var(--h1)',fg:'var(--h1t)'};
  if(n<=4) return{bg:'var(--h2)',fg:'var(--h2t)'};
  if(n<=7) return{bg:'var(--h3)',fg:'var(--h3t)'};
  if(n<=10)return{bg:'var(--h4)',fg:'var(--h4t)'};
  if(n<=14)return{bg:'var(--h5)',fg:'var(--h5t)'};
  return{bg:'var(--h6)',fg:'var(--h6t)'};
}

const peakHour={};
DAYS.forEach(d=>{
  const h=DATA[d].hours;
  let maxH=-1,maxV=0;
  Object.entries(h).forEach(([hh,v])=>{if(v>maxV){maxV=v;maxH=+hh;}});
  peakHour[d]=maxH;
});

const tbl=document.getElementById('hm-table');

// Header
let thead='<thead><tr><th class="hour-h">時間帯</th>';
DAYS.forEach(d=>{
  const dw=DATA[d].dow;
  const c=DOW_COLOR[dw];
  thead+=`<th style="color:${c}"><div>${d}日</div><div>${dw}</div></th>`;
});
thead+='<th>計</th></tr></thead>';

// Body
let tbody='<tbody>';
HOURS.forEach(h=>{
  let rowTotal=0;
  let row=`<tr><td class="hour-lbl">${String(h).padStart(2,'0')}時</td>`;
  DAYS.forEach(d=>{
    const n=DATA[d].hours[h]||0;
    rowTotal+=n;
    const {bg,fg}=colorCell(n);
    const isPeak=(peakHour[d]===h && n>0);
    row+=`<td style="background:${bg};color:${fg}${isPeak?';outline:2px solid rgba(255,255,255,.7);outline-offset:-2px;font-weight:800':''}">`;
    row+=n===0?'':n;
    row+='</td>';
  });
  row+=`<td class="row-sum">${rowTotal||''}</td></tr>`;
  tbody+=row;
});
tbody+='</tbody>';

// Footer
let tfoot='<tfoot><tr><td style="background:var(--bg-c);font-weight:700;font-size:11px;position:sticky;left:0;z-index:1">日計</td>';
DAYS.forEach(d=>{
  const t=DATA[d].total;
  const dw=DATA[d].dow;
  const c=DOW_COLOR[dw];
  tfoot+=`<td class="col-sum" style="color:${c}">${t||'-'}</td>`;
});
const grandTotal=DAYS.reduce((s,d)=>s+DATA[d].total,0);
tfoot+=`<td style="font-weight:800">${grandTotal}</td></tr></tfoot>`;

tbl.innerHTML=thead+tbody+tfoot;

// KPI
const measuredDays=DAYS.filter(d=>DATA[d].total>0).length;
const realDays=DAYS.filter(d=>DATA[d].total>=20).length;
const maxDay=DAYS.reduce((a,b)=>DATA[a].total>DATA[b].total?a:b);
const avgPerMeas=Math.round(grandTotal/measuredDays*10)/10;
const friDays=[2,9,16,23].filter(d=>DATA[d]&&DATA[d].total>0);
const friTotal=friDays.reduce((s,d)=>s+DATA[d].total,0);

document.getElementById('kpi-row').innerHTML=`
<div class="card"><div class="lbl">実測台数（10/1〜24）</div><div class="val">${grandTotal}台</div><div class="sub">10/24(土)まで</div></div>
<div class="card"><div class="lbl">データあり日数</div><div class="val">${measuredDays}日</div><div class="sub">うち実質計測${realDays}日（20台以上）</div></div>
<div class="card"><div class="lbl">最多計測日</div><div class="val" style="color:var(--fri)">10/${maxDay}(${DATA[maxDay].dow})</div><div class="sub">${DATA[maxDay].total}台</div></div>
<div class="card"><div class="lbl">金曜計（2・23日）</div><div class="val" style="color:var(--fri)">${friTotal}台</div><div class="sub">10/2(71台) + 10/23(75台)</div></div>
`;
</script>
</body>
</html>
